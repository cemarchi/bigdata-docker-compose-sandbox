services:
  # SPARK
  # MASTER
  spark-master:
    build: ./spark    
    container_name: spark-master    
    ports:
      - "${SPARK_UI_PORT}:8080"  # SPARK UI Port
      - "${SPARK_MASTER_PORT}:7077" # SPARK MASTER Port
    environment:
      - SPARK_MODE=master      
      - SPARK_MASTER_PORT=${SPARK_MASTER_PORT}      
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no  
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    networks:
      - spark-network
      - backend
      - postgres

  # NODE - include as many Spark workers as you want by simply changing the container name 
  spark-worker-1:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g    
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    networks:
      - spark-network
      - backend
      - postgres

  spark-worker-2:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g 
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no 
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no  
    networks:
      - spark-network
      - backend
      - postgres

  spark-worker-3:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-3
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no  
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no 
    networks:
      - spark-network
      - backend
      - postgres

  spark-worker-4:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-4
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g 
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no  
    networks:
      - spark-network
      - backend
      - postgres

  spark-worker-5:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-5
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker      
      - SPARK_MASTER_URL=spark://spark-master:${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g 
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no   
    networks:
      - spark-network
      - backend
      - postgres

  spark-worker-6:
    image: bitnami/spark:3.5.3
    container_name: spark-worker-6
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker      
      - SPARK_MASTER_URL=spark://spark-master:${SPARK_MASTER_PORT}
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g 
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no 
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no 
    networks:
      - spark-network
      - backend
      - postgres

  # POSTGRESQL
  postgresdb:
      restart: always
      image: postgres:14.15-alpine
      container_name: postgres_db
      ports:
        - "${PG_PORT}:5432"
      networks:
        - backend
        - postgres
      environment:
        - POSTGRES_USER=${PG_USER}
        - POSTGRES_PASSWORD=${PG_PASSWORD}
        - POSTGRES_DATABASE=${PG_DATABASE}
      volumes:
        - postgres-data:/var/lib/postgresql/data/
      healthcheck:
        test: ["CMD", "pg_isready", "-p", "${PG_PORT}", "-U", "${PG_USER}"]
        interval: 5s
        timeout: 5s
        retries: 3

  # PGADMIN
  pgadmin:
      image: dpage/pgadmin4:8.14.0
      container_name: pgadmin
      restart: always
      depends_on:
        - postgresdb
      networks:
        - postgres
      environment:
        - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
        - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
        - PGADMIN_CONFIG_SERVER_MODE=False
      ports:
        - "${PGADMIN_PORT}:80"
      volumes:
        - pgadmin-data:/var/lib/pgadmin

  # MinIO
  s3:
    restart: always
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z.fips
    container_name: minio
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    networks:
      - frontend
      - backend
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ADDRESS=${MINIO_ADDRESS}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_STORAGE_USE_HTTPS=${MINIO_STORAGE_USE_HTTPS}
      - MINIO_CONSOLE_ADDRESS=${MINIO_CONSOLE_ADDRESS}
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_ROOT_USER}/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  create_buckets:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z.fips
    container_name: mlflow_create_buckets
    depends_on:
      - s3
    networks:
      - backend
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set s3 http://s3:${MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      if /usr/bin/mc stat s3/${MLFLOW_BUCKET_NAME} >/dev/null 2>&1; then
        echo 'Bucket ${MLFLOW_BUCKET_NAME} already exists';
      else
        /usr/bin/mc mb s3/${MLFLOW_BUCKET_NAME};
        /usr/bin/mc policy set download s3/${MLFLOW_BUCKET_NAME};
      fi;
        exit 0;
      "

  tracking_server:
    restart: always
    build: ./mlflow
    image: mlflow_server
    container_name: mlflow_server
    depends_on:
      - postgresdb
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - frontend
      - backend
      - postgres
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_PASSWORD}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:${MINIO_PORT}
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER}:${PG_PASSWORD}@postgresdb:${PG_PORT}/${PG_DATABASE}
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MLFLOW_PORT}/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  spark-network:  
  frontend:
  backend:
  postgres:

volumes:
  postgres-data:
  pgadmin-data:
  minio-data: